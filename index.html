<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Bodhi Calendar</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#101827;--panel:#1b2738;--line:#304054;--text:#f4f6fa;--muted:#9eafc2;--blue:#397bc8;--pink:#d678a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:720px;margin:auto;padding:24px 16px 50px}header,.nav,.toolbar,.legend{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:24px}h1{font-size:24px;letter-spacing:-.7px;margin:0}h2{font-size:19px;margin:0}p{margin:5px 0 0;color:var(--muted);font-size:13px}button{font:inherit;cursor:pointer;border:1px solid var(--line);color:var(--text);background:var(--panel);border-radius:12px;min-height:42px;padding:8px 12px}button:focus-visible{outline:2px solid #fff;outline-offset:2px}button.active{background:#385477;border-color:#6484aa}button.primary{background:#397bc8;border-color:#397bc8;font-weight:600}.toolbar{margin-bottom:20px;flex-wrap:wrap}.segments{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:14px}.segments button{min-height:36px;border:0;background:transparent;padding:7px 11px}.segments button.active{background:#3c536e}.nav{margin-bottom:18px}.nav>div{display:flex;gap:8px}.legend{justify-content:flex-start;gap:20px;margin:18px 0 10px;font-size:13px;color:var(--muted)}.dot{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px}.blue{background:var(--blue)}.pink{background:var(--pink)}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.weekday{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}.day{height:clamp(55px,11vw,88px);width:100%;display:flex;align-items:flex-start;justify-content:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:16px;font-weight:600;transition:background .12s}.day.blue{background:var(--blue);border-color:var(--blue);color:#fff}.day.pink{background:var(--pink);border-color:var(--pink);color:#fff}.day.today{outline:2px solid #e6edf8;outline-offset:-3px}.day.outside{opacity:.28}.day.empty{visibility:hidden}.day:active{transform:scale(.97)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:25px}.hint{margin-top:16px;line-height:1.5}.status{min-height:20px;margin-top:12px;color:var(--muted);font-size:12px}footer{margin-top:40px;color:var(--muted);font-size:12px}#exportCanvas{display:none}@media(max-width:390px){main{padding:18px 10px}.grid{gap:4px}.day{padding:8px;border-radius:9px}.toolbar{gap:8px}h1{font-size:21px}}
</style></head><body><main>
<header><div><h1>Bodhi Calendar</h1><p>Simple shared parenting schedule</p></div><button id="today">Today</button></header>
<div class="toolbar"><div class="segments" role="group" aria-label="Calendar view"><button data-view="7">1 Week</button><button data-view="14">2 Weeks</button><button data-view="month">Month</button></div></div>
<div class="nav"><h2 id="period"></h2><div><button id="prev" aria-label="Previous period">‹</button><button id="next" aria-label="Next period">›</button></div></div>
<div class="grid" id="calendar" aria-label="Parenting calendar"></div>
<div class="legend"><span><i class="dot blue"></i>Jared</span><span><i class="dot pink"></i>Kayla</span></div>
<p class="hint">Tap a date: blue → pink → clear. Your changes save automatically on this device.</p>
<div class="actions"><button class="primary" id="share">Share image</button><button id="save">Save PNG</button><button id="backup">Backup</button><button id="restore">Restore</button><button id="clear" aria-label="Clear assignments in current view">Clear view</button><input type="file" id="file" accept="application/json" hidden></div>
<div class="status" id="status" role="status" aria-live="polite">Starting calendar…</div><footer>Stored locally on this device. No account or synchronization required.</footer>
</main><canvas id="exportCanvas"></canvas>
<script>
window.addEventListener('error',function(e){var x=document.getElementById('status');if(x)x.textContent='App error: '+e.message+' (line '+e.lineno+')'});
(()=>{'use strict';
const KEY='bodhi-calendar-days-v1',VIEW='bodhi-calendar-view-v1';
let assignments={};try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');if(x&&typeof x==='object'&&!Array.isArray(x))assignments=x}catch{}
const safeGet=k=>{try{return localStorage.getItem(k)}catch{return null}};const safeSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch{return false}};let view=safeGet(VIEW)||'month';if(!['7','14','month'].includes(view))view='month';
const now=new Date(),anchor=new Date(now.getFullYear(),now.getMonth(),now.getDate());const el=id=>document.getElementById(id);
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const weekStart=d=>add(d,-d.getDay());
const label=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
function range(){if(view==='month'){const first=new Date(anchor.getFullYear(),anchor.getMonth(),1),last=new Date(anchor.getFullYear(),anchor.getMonth()+1,0);return {start:weekStart(first),end:add(weekStart(last),6),first,last}}const start=weekStart(anchor);return {start,end:add(start,Number(view)-1)}}
function daysInRange(){const r=range(),days=[];for(let d=r.start;d<=r.end;d=add(d,1))days.push(d);return days}
function title(){const r=range();if(view==='month')return anchor.toLocaleDateString('en-US',{month:'long',year:'numeric'});return label(r.start)+' – '+label(r.end)+', '+r.end.getFullYear()}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view))});el('period').textContent=title();const grid=el('calendar');grid.innerHTML='';['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(s=>{const h=document.createElement('div');h.className='weekday';h.textContent=s;grid.append(h)});for(const d of daysInRange()){const k=iso(d),v=assignments[k]||0,b=document.createElement('button');b.className='day'+(v===1?' blue':v===2?' pink':'')+(k===iso(now)?' today':'')+(view==='month'&&d.getMonth()!==anchor.getMonth()?' outside':'');b.textContent=d.getDate();b.setAttribute('aria-label',d.toLocaleDateString('en-US',{dateStyle:'full'})+', '+(['unassigned','Jared','Kayla'][v]));b.addEventListener('click',()=>{const next=(v+1)%3;if(next)assignments[k]=next;else delete assignments[k];if(!safeSet(KEY,JSON.stringify(assignments)))status('Storage unavailable; export a backup.');render()});grid.append(b)}}
function status(t){el('status').textContent=t}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;safeSet(VIEW,view);render()});
el('prev').onclick=()=>{anchor.setTime(view==='month'?new Date(anchor.getFullYear(),anchor.getMonth()-1,1).getTime():add(anchor,-Number(view)).getTime());render()};
el('next').onclick=()=>{anchor.setTime(view==='month'?new Date(anchor.getFullYear(),anchor.getMonth()+1,1).getTime():add(anchor,Number(view)).getTime());render()};
el('today').onclick=()=>{anchor.setTime(new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime());render()};
function image(){const days=daysInRange(),rows=days.length/7,c=el('exportCanvas'),w=1400,pad=65,cell=(w-2*pad)/7,ch=125,top=235;c.width=w;c.height=top+rows*ch+135;const ctx=c.getContext('2d');ctx.fillStyle='#101827';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#f4f6fa';ctx.font='bold 49px -apple-system,Arial';ctx.fillText('Bodhi Calendar',pad,85);ctx.font='30px -apple-system,Arial';ctx.fillStyle='#b4c4d6';ctx.fillText(title(),pad,137);['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach((x,i)=>{ctx.font='23px Arial';ctx.fillText(x,pad+i*cell+12,top-35)});days.forEach((d,i)=>{const x=pad+(i%7)*cell,y=top+Math.floor(i/7)*ch,k=iso(d),v=assignments[k]||0;ctx.fillStyle=v===1?'#397bc8':v===2?'#d678a6':'#1b2738';ctx.fillRect(x+3,y+3,cell-7,ch-7);ctx.fillStyle='#fff';ctx.font='bold 29px Arial';ctx.fillText(String(d.getDate()),x+18,y+43);if(view==='month'&&d.getMonth()!==anchor.getMonth()){ctx.fillStyle='rgba(16,24,39,.55)';ctx.fillRect(x+3,y+3,cell-7,ch-7)}});const y=c.height-55;ctx.font='24px Arial';ctx.fillStyle='#397bc8';ctx.fillRect(pad,y-22,24,24);ctx.fillStyle='#e8eef5';ctx.fillText('Jared',pad+37,y);ctx.fillStyle='#d678a6';ctx.fillRect(pad+190,y-22,24,24);ctx.fillStyle='#e8eef5';ctx.fillText('Kayla',pad+227,y);return new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error('Image export failed')),'image/png'))}
function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
el('save').onclick=async()=>{try{download(await image(),'bodhi-calendar-'+iso(anchor)+'.png');status('Image saved.')}catch(e){status(e.message)}};
el('share').onclick=async()=>{try{const blob=await image(),file=new File([blob],'bodhi-calendar.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Bodhi Calendar'})}else{download(blob,'bodhi-calendar.png');status('Sharing unavailable; PNG downloaded instead.')}}catch(e){if(e.name!=='AbortError')status('Could not share: '+e.message)}};
el('clear').onclick=()=>{const dates=daysInRange().filter(d=>view!=='month'||d.getMonth()===anchor.getMonth()&&d.getFullYear()===anchor.getFullYear());const keys=dates.map(iso);const count=keys.filter(k=>assignments[k]===1||assignments[k]===2).length;if(!count){status('No assignments to clear in this view.');return}const scope=view==='month'?'the entire '+title():view==='7'?'this week':'these two weeks';if(!confirm('Clear '+count+' assigned '+(count===1?'day':'days')+' in '+scope+'? Other dates will remain unchanged.'))return;keys.forEach(k=>delete assignments[k]);if(!safeSet(KEY,JSON.stringify(assignments)))status('Could not save changes; storage unavailable.');else status('Cleared '+count+' '+(count===1?'day':'days')+' from the current view.');render()};
el('backup').onclick=()=>{download(new Blob([JSON.stringify({version:1,assignments},null,2)],{type:'application/json'}),'bodhi-calendar-backup.json');status('Backup downloaded.')};
el('restore').onclick=()=>el('file').click();
el('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.version!==1||!obj.assignments||typeof obj.assignments!=='object'||Array.isArray(obj.assignments))throw Error('Invalid backup');const cleaned={};for(const [k,v] of Object.entries(obj.assignments)){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&(v===1||v===2))cleaned[k]=v}if(!confirm('Replace the saved calendar with this backup?'))return;assignments=cleaned;localStorage.setItem(KEY,JSON.stringify(assignments));render();status('Backup restored.')}catch(err){status('Could not restore: '+err.message)}finally{e.target.value=''}};
try{render();status('Calendar ready — tap any date.')}catch(error){status('Calendar initialization error: '+error.message);console.error(error)}
})();
</script></body></html>
